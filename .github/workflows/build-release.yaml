name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Override version (blank = use version.py, e.g. "0.9.0")'
        required: false
        default: ''
      dry_run:
        description: 'Build and test everything, publish nothing (no draft release, nothing staged on the update host)'
        type: boolean
        default: false
      web_ui:
        description: 'Also build the web UI (Tauri + sidecar). It bundles its own CUDA PyTorch, about 40 more Windows minutes'
        type: boolean
        default: false
      update_min_version:
        description: 'Oldest version that may update to this one in place (blank = any). Set it when the install layout changes'
        required: false
        default: ''

permissions:
  contents: write

env:
  # The published packs (publish-packs.yaml): PyTorch for NVIDIA and for CPU,
  # and CLIP. Built once per torch version, reused by every release. A new
  # pack is published under a new tag, and this line moves to it.
  PACKS_BASE: https://github.com/Aseiel/VideoHighlighter/releases/download/packs-torch-2.7.1
  # The update host (Cloudflare R2). tools/publish_release.py has the layout.
  R2_BUCKET: vh-updates
  # R2 rejects the CRC64 checksums newer AWS CLIs send by default.
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

jobs:
  # Single source of truth for the release version. Defaults to version.py so
  # the release always matches what the app reports about itself (/health on the
  # sidecar, the window title in the Qt app); the manual input can still
  # override it. Gates the build jobs, so a forgotten bump fails here in seconds
  # instead of after an hour of PyInstaller.
  version:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.compute.outputs.slug }}        # e.g. 0.9.0
    steps:
      - uses: actions/checkout@v4
      - id: compute
        env:
          OVERRIDE: ${{ github.event.inputs.release_version }}
        run: |
          RAW="$OVERRIDE"
          PY=$(python3 -c "import version; print(version.__version__)")
          if [ -z "$RAW" ]; then
            RAW="$PY"
          elif [ "${RAW%% *}" != "$PY" ]; then
            # The override names the tag and the archives; version.py is what the
            # app reports about itself and what the update manifest is stamped
            # with. Nothing used to check that the two agreed, so a release could
            # be tagged 0.9.1 while every file inside it still said 0.9.0 -- the
            # About box understates the build, and the updater keeps offering
            # 0.9.1 to people who already have it, because the manifest they
            # installed claims otherwise.
            echo "::error::Override '$RAW' does not agree with __version__ '$PY' in version.py. Bump version.py and commit it, or drop the override."
            exit 1
          fi
          echo "slug=${RAW// /-}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${RAW// /-}"
      - name: Refuse to re-release an existing version
        # A dry run publishes nothing, so it may rebuild a released version.
        if: ${{ !inputs.dry_run }}
        # checkout is shallow and fetches no tags, so ask the remote directly
        # rather than looking for a local ref that is never there.
        env:
          SLUG: ${{ steps.compute.outputs.slug }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$SLUG" >/dev/null 2>&1; then
            echo "::error::Tag $SLUG already exists. Bump __version__ in version.py and commit before releasing."
            exit 1
          fi
          echo "Tag $SLUG is free."
      - name: Check the shipped version strings agree
        # tests/test_version_sync.py asserts version.py, package.json,
        # tauri.conf.json, Cargo.toml and Cargo.lock all match. A mismatch here
        # means the installer would advertise a version the app disagrees with.
        run: |
          pip install -r requirements-dev.txt
          pytest tests/test_version_sync.py -q

  # The desktop app as a core without PyTorch, plus PyTorch as packs.
  #
  # CUDA PyTorch was 4.4 GB of the 6.9 GB install, and every release installed
  # it from pip, bundled it, and compressed it again — twice, counting the web
  # UI — although it changes only when torch does. It is now built once per
  # torch version (build-packs.yaml with rebuild_packs, published by
  # publish-packs.yaml) and every release reuses the published packs, pinned by
  # SHA-256. This job never installs or compresses CUDA; it downloads the
  # NVIDIA pack only to smoke-test the app on it.
  #
  # Ships: the installer (core + CPU pack; NVIDIA and CLIP downloaded during
  # setup), a portable .7z (core + CPU pack; the app fetches the others on first
  # use, modules/packs), and the per-file update manifest, whose blobs go to
  # the update host (tools/publish_release.py has the whole release flow).
  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        # torch is the CPU wheel on purpose. It is excluded from the bundle
        # (tools/pack_core_args.py) and only has to be importable while
        # PyInstaller analyses the modules that import it; the 2.5 GB CUDA
        # wheel bought nothing here but a slower install.
        run: |
          pip install numpy==2.2.6 mkl mkl-include
          pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu
          pip install openvino==2026.2.1
          pip install -r requirements.txt
          # YOLOX (Apache-2.0) for training detectors in the app. --no-deps:
          # its declared requirements would let pip replace the torch above.
          pip install yolox==0.3.0 --no-deps
          pip install pyinstaller psutil
      - name: Fetch the published packs
        # Checked against the SHA-256 in their packs.json; the two torch packs
        # are unpacked for the smoke tests, and the installer carries the CPU
        # one. CLIP stays a download (Setup and the app fetch it).
        shell: pwsh
        run: |
          $ProgressPreference = "SilentlyContinue"
          New-Item -ItemType Directory -Force out, build-packs, packs-dl | Out-Null
          Invoke-WebRequest "$env:PACKS_BASE/packs.json" -OutFile out/packs.json -UseBasicParsing
          $packs = (Get-Content out/packs.json -Raw | ConvertFrom-Json).packs
          foreach ($p in $packs) {
            if ($p.name -notlike "torch-*") { continue }
            $file = "packs-dl/$($p.asset)"
            Invoke-WebRequest "$env:PACKS_BASE/$($p.asset)" -OutFile $file -UseBasicParsing
            $sha = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
            if ($sha -ne $p.sha256) { throw "$($p.asset): sha256 $sha, packs.json says $($p.sha256)" }
            7z x -y $file "-obuild-packs/$($p.name)" | Out-Null
            Remove-Item $file
            Write-Host ("{0,8} MB  {1}  (verified)" -f [math]::Round($p.bytes / 1MB), $p.asset)
          }
      - name: Check the NVIDIA pack covers every supported GPU generation
        # The pack decides which NVIDIA cards get a GPU at all. torch 2.6.0+cu124
        # stopped at sm_90, and an RTX 50-series (sm_120) failed with "no kernel
        # image is available". get_arch_list() is empty on a runner without a
        # GPU, so read the compiled list: GTX 10, RTX 20, RTX 30 (RTX 40 is
        # served by the sm_8x kernels) and RTX 50.
        run: |
          python -c "import sys; sys.path.insert(0, 'build-packs/torch-cu128/site-packages'); import torch; assert '+cu' in torch.__version__, torch.__version__; flags = torch._C._cuda_getArchFlags().split(); print('torch', torch.__version__, 'CUDA archs:', ' '.join(flags)); missing = [a for a in ('sm_61', 'sm_75', 'sm_86', 'sm_120') if a not in flags]; assert not missing, 'torch pack lacks ' + ', '.join(missing)"
      - name: Fetch YOLOX detector models (Apache-2.0)
        # models/yolox/ is gitignored (downloaded, not committed). Without this
        # the packaged app has no object detector, and a frozen build never
        # downloads one itself. Bundled via --add-data "models;models".
        run: python tools/get_yolox_model.py
      - name: Build EXE
        shell: pwsh
        run: |
          $extra = python tools/pack_core_args.py
          pyinstaller --name "VideoHighlighter" `
            --icon "assets/icon.ico" `
            --splash "assets/splash.png" `
            --windowed `
            --noconfirm `
            --log-level WARN `
            --add-data "config.yaml;." `
            --add-data "yolo_objects_labels.json;." `
            --add-data "kinetics_400_labels.json;." `
            --add-data "assets;assets" `
            --add-data "modules;modules" `
            --add-data "models;models" `
            --add-data "video_ai_editor/VRVideoOutput.qml;video_ai_editor" `
            --add-data "video_ai_editor/models;video_ai_editor/models" `
            --hidden-import action_recognition `
            --hidden-import convert_pth_to_openvino `
            --hidden-import crop_actions `
            --hidden-import downloader `
            --hidden-import object_recognition `
            --hidden-import pipeline `
            --hidden-import signal_timeline_viewer `
            --hidden-import sorter `
            --hidden-import video_picker_dialog `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtGui `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtQml `
            --hidden-import PySide6.QtQuick `
            --hidden-import PySide6.QtQuickWidgets `
            --hidden-import PySide6.QtMultimedia `
            --hidden-import modules.system.smoke_test `
            --hidden-import psutil `
            --collect-submodules whisper `
            --collect-submodules yolox `
            --collect-submodules model_hub `
            --collect-submodules huggingface_hub `
            --collect-submodules keyring `
            --copy-metadata keyring `
            --collect-all openvino `
            --collect-all onnxruntime `
            --collect-data whisper `
            --collect-binaries imageio_ffmpeg `
            --hidden-import llm.clip_prefilter `
            --additional-hooks-dir packaging/pyinstaller-hooks `
            --exclude-module nncf `
            --collect-submodules optimum `
            --collect-submodules transformers `
            --collect-data transformers `
            --copy-metadata transformers `
            --copy-metadata tokenizers `
            --copy-metadata huggingface-hub `
            --copy-metadata safetensors `
            --copy-metadata regex `
            @extra `
            main.py
          if (Test-Path dist/VideoHighlighter/_internal/torch) {
            throw "torch was bundled into the core; it must only arrive as a pack"
          }
      - name: Strip what the app never loads
        run: python tools/strip_bundle.py dist/VideoHighlighter
      - name: Check ml_dtypes can find the DLLs it links against
        # ml_dtypes (via onnx) links against a delvewheel-renamed MSVC runtime it
        # expects in numpy.libs. With numpy pinned older than the one ml_dtypes was
        # built beside, that name is not numpy's own: 0.11.1 and 0.11.2 shipped it
        # in pandas.libs only, and every DirectML ONNX export failed with "DLL load
        # failed while importing _ml_dtypes_ext". This reads the names out of the
        # BUNDLED extension, so it checks what the exe will ask for rather than
        # what the runner's numpy happens to vendor, which is how it passed before.
        run: |
          python -c "import glob, os, re; root = os.path.join('dist', 'VideoHighlighter', '_internal'); exts = glob.glob(os.path.join(root, 'ml_dtypes', '**', '*.pyd'), recursive=True); assert exts, 'no ml_dtypes extension in the bundle, so onnx cannot import'; want = sorted({m.decode() for p in exts for m in re.findall(rb'[\w.+-]+-[0-9a-f]{32}\.dll', open(p, 'rb').read(), re.I)}); libs = os.path.join(root, 'numpy.libs'); have = set(os.listdir(libs)) if os.path.isdir(libs) else set(); missing = [n for n in want if n not in have]; print('ml_dtypes links against:', ', '.join(want) or 'nothing vendored'); assert not missing, 'bundled numpy.libs lacks ' + ', '.join(missing)"
      - name: Add what the app needs to fetch packs itself
        # The pinned pack list and 7-Zip (modules/packs). Before the manifest,
        # so an update carries a new lock when the packs move.
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.7-zip.org/a/7zr.exe -OutFile packaging/installer/7zr.exe -UseBasicParsing
          Copy-Item packaging/installer/7zr.exe dist/VideoHighlighter/7zr.exe
          python tools/write_packs_lock.py --base "$env:PACKS_BASE" --packs-json out/packs.json `
            --out dist/VideoHighlighter/packs.lock.json
          $size = (Get-ChildItem -Recurse ./dist/VideoHighlighter | Measure-Object -Property Length -Sum).Sum / 1GB
          Write-Host "Core size: $([math]::Round($size, 2)) GB"
      - name: Generate the update manifest
        # Every shipped file with its SHA-256, written INTO the bundle so each
        # install carries a record of what it was given. The updater diffs the
        # next release against it and fetches only the files that differ.
        # base_url is the update host; it is also how an installed copy finds
        # its channel file (update_check.channel_urls). Signed later, offline.
        shell: pwsh
        env:
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          MIN_VERSION: ${{ inputs.update_min_version }}
        run: |
          $v = python -c "import version; print(version.__version__)"
          $e = python -c "import version; print(version.__edition__)"
          $floor = @()
          if ($env:MIN_VERSION) { $floor = @("--min-version", $env:MIN_VERSION) }
          python tools/build_manifest.py generate --root dist/VideoHighlighter `
            --version "$v" --edition "$e" --platform windows `
            --base-url "$env:UPDATE_BASE_URL" @floor
          if ($LASTEXITCODE -ne 0) { throw "manifest generation failed" }
      - name: Smoke test with each pack
        # The headless checks the mac release runs too (modules/system/smoke_test.py):
        # main.py's imports, the pipeline import, object detection, a spawned
        # child — with torch coming from the CPU pack, then the NVIDIA one (the
        # runner has no GPU, so that proves the CUDA DLLs load in the frozen
        # process). On a copy: the app writes its logs and caches beside the
        # exe, and none of that may ship.
        shell: pwsh
        timeout-minutes: 40
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=30 `
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 30 -c:v libx264 -pix_fmt yuv420p -c:a aac smoke.mp4
          $app = "$env:RUNNER_TEMP\smoke-app"
          Copy-Item -Recurse dist/VideoHighlighter $app
          $status = 0
          foreach ($pack in @("torch-cpu", "torch-cu128")) {
            Remove-Item -Recurse -Force "$app\packs" -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force "$app\packs" | Out-Null
            Copy-Item -Recurse "build-packs/$pack" "$app\packs\$pack"
            Write-Host "::group::smoke test with $pack"
            $p = Start-Process -FilePath "$app\VideoHighlighter.exe" `
                   -ArgumentList @("--smoke-test", "$PWD/smoke.mp4", "--smoke-report", "$PWD/smoke-report-$pack.json") `
                   -Wait -PassThru
            if (Test-Path "smoke-report-$pack.json") { Get-Content "smoke-report-$pack.json" }
            Get-ChildItem $app -Filter *.log -ErrorAction SilentlyContinue |
              ForEach-Object { Copy-Item $_.FullName "debug-$pack.log"; Get-Content $_.FullName -Tail 60 }
            Write-Host "::endgroup::"
            Write-Host "$pack exit code: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { $status = 1 }
          }
          Remove-Item -Recurse -Force $app
          exit $status
      - name: Build the installer
        # Core + CPU pack; NVIDIA (ticked when a card is found) and CLIP are
        # downloaded during setup from PACKS_BASE and checked against the
        # SHA-256 pinned here. Fixed filename, no version in it, so
        # /releases/latest/download/00-VideoHighlighter-Windows-Setup.exe is a
        # permanent link; the version is compiled into the exe.
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Out-Null
          $packs = (Get-Content out/packs.json | ConvertFrom-Json).packs
          $cuda = $packs | Where-Object { $_.name -eq "torch-cu128" }
          $clip = $packs | Where-Object { $_.name -eq "models-clip" }
          $installedMB = [int][math]::Ceiling(((Get-ChildItem dist/VideoHighlighter, build-packs/torch-cpu -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB)
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q `
            "/DAppVersion=${{ needs.version.outputs.slug }}" `
            "/DOutputName=00-VideoHighlighter-Windows-Setup" `
            "/DDistDir=$((Resolve-Path dist/VideoHighlighter).Path)" `
            "/DCpuPackDir=$((Resolve-Path build-packs/torch-cpu).Path)" `
            "/DPackBase=$env:PACKS_BASE" `
            "/DCudaPackAsset=$($cuda.asset)" `
            "/DCudaPackSha256=$($cuda.sha256)" `
            "/DCudaPackMB=$([int][math]::Ceiling($cuda.bytes / 1MB))" `
            "/DCudaInstalledMB=$([int][math]::Ceiling($cuda.bytes_installed / 1MB))" `
            "/DClipPackAsset=$($clip.asset)" `
            "/DClipPackSha256=$($clip.sha256)" `
            "/DClipPackMB=$([int][math]::Ceiling($clip.bytes / 1MB))" `
            "/DClipInstalledMB=$([int][math]::Ceiling($clip.bytes_installed / 1MB))" `
            "/DInstalledMB=$installedMB" `
            "/O$((Resolve-Path out).Path)" `
            packaging/installer/videohighlighter-packs.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $exe = Get-Item out/00-VideoHighlighter-Windows-Setup.exe
          Write-Host ("installer: {0} MB (installs {1} MB)" -f [math]::Round($exe.Length / 1MB), $installedMB)
      - name: Install silently and smoke-test the installed app
        # What a customer's machine gets, rather than the build folder. Both
        # downloads ticked: fetch from PACKS_BASE, SHA-256 check, unpack, the
        # NVIDIA pack replacing the CPU one, CLIP landing in models/. Then the
        # install must carry the update manifest the updater diffs against.
        shell: pwsh
        timeout-minutes: 30
        run: |
          $dir = "$env:RUNNER_TEMP\vh-installed"
          $p = Start-Process out/00-VideoHighlighter-Windows-Setup.exe -Wait -PassThru -ArgumentList @(
                 "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$dir",
                 "/MERGETASKS=!desktopicon,clip,nvidia", "/LOG=$PWD\setup.log")
          Write-Host "setup exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Get-Content setup.log -Tail 60; exit 1 }
          $packs = @(Get-ChildItem "$dir\packs" -Directory | ForEach-Object Name)
          if (($packs -join ",") -ne "torch-cu128") { Get-Content setup.log -Tail 60; throw "expected only torch-cu128 installed, found: $($packs -join ', ')" }
          if (-not (Test-Path "$dir\models\clip-vit-base-patch32-ov\openvino_model.xml")) { Get-Content setup.log -Tail 60; throw "CLIP was not installed into models\" }
          if (-not (Test-Path "$dir\manifest.json")) { throw "the install has no manifest.json, so it could never update in place" }
          Write-Host "downloads OK: torch-cu128 replaced torch-cpu, CLIP in models\, manifest.json present"
          $s = Start-Process -FilePath "$dir\VideoHighlighter.exe" -Wait -PassThru `
                 -ArgumentList @("--smoke-test", "$PWD/smoke.mp4", "--smoke-report", "$PWD/smoke-report-installed.json")
          if (Test-Path smoke-report-installed.json) { Get-Content smoke-report-installed.json }
          Get-ChildItem $dir -Filter *.log -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "debug-installed.log" }
          Write-Host "installed app smoke exit code: $($s.ExitCode)"
          exit $s.ExitCode
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-test
          path: |
            smoke-report-*.json
            debug-*.log
            setup.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stage the update on the update host
        # Blobs by hash (only ones the host lacks are sent) and the UNSIGNED
        # manifest. Nothing points at it until publish-update.yaml runs with a
        # signature, and the app refuses a manifest without one, so staging is
        # safe to do before the release is even reviewed.
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$UPDATE_BASE_URL" ]; then
            echo "::warning::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY secrets or R2_ACCOUNT_ID / UPDATE_BASE_URL variables are not set; this release cannot be installed in place. docs/UPDATES.md has the setup."
            exit 0
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          python tools/publish_release.py prepare --root dist/VideoHighlighter \
            --out publish --allow-unsigned --github-output prefix.txt
          prefix=$(sed -n 's/^prefix=//p' prefix.txt)
          if aws s3api head-object --endpoint-url "$endpoint" --bucket "$R2_BUCKET" \
               --key "$prefix/manifest.json.sig" >/dev/null 2>&1; then
            echo "::error::$prefix is already signed and published; a published release is never replaced. Bump the version."
            exit 1
          fi
          # Hash-named, so a key that exists already holds these exact bytes.
          aws s3 sync publish/files "s3://$R2_BUCKET/files" --endpoint-url "$endpoint" \
            --size-only --only-show-errors \
            --content-type application/octet-stream \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "publish/$prefix/manifest.json" "s3://$R2_BUCKET/$prefix/manifest.json" \
            --endpoint-url "$endpoint" --content-type application/json --cache-control "no-cache"
          echo "staged: $UPDATE_BASE_URL/$prefix/manifest.json"
      - name: Upload update manifest
        uses: actions/upload-artifact@v4
        with:
          name: windows-manifest
          path: dist/VideoHighlighter/manifest.json
          # Artifacts here are a handoff to the `release` job minutes later, not
          # an archive — the durable copies are the Release assets. At the 90-day
          # default a single mac DMG is 1.2 GB, and a handful of runs exhausted
          # the account's storage and blocked every subsequent build with
          # "Artifact storage quota has been hit" for 6-12 hours at a time.
          # Anything still wanted after a week is wanted from the Release.
          retention-days: 7
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: out/00-VideoHighlighter-Windows-Setup.exe
          compression-level: 0
          retention-days: 7
      - name: Create the portable archive
        # Core + CPU pack: a working app offline; NVIDIA and CLIP are fetched
        # by the app on first use. Volumes named .7z.001 even when there is only
        # one, which is what the bootstrap zip's asset_pattern looks for.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/VideoHighlighter/packs | Out-Null
          Copy-Item -Recurse build-packs/torch-cpu dist/VideoHighlighter/packs/torch-cpu
          7z a -t7z -mx=9 -v1900m "VideoHighlighter-Windows-${{ needs.version.outputs.slug }}.7z" ./dist/VideoHighlighter | Out-Null
          Get-ChildItem "VideoHighlighter-Windows-${{ needs.version.outputs.slug }}.7z.*" |
            ForEach-Object { Write-Host ("{0,8} MB  {1}" -f [math]::Round($_.Length / 1MB), $_.Name) }
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          if-no-files-found: error
          path: "VideoHighlighter-Windows-${{ needs.version.outputs.slug }}.7z*"
          compression-level: 0
          retention-days: 7

  # The web UI: a Tauri shell around the React frontend, with the Python engine
  # bundled as a PyInstaller sidecar. Independent of the Qt build above — both
  # ship from the same engine source.
  build-web-windows:
    # Opt-in: the sidecar still bundles CUDA PyTorch itself, which is the
    # expensive part this workflow no longer does for the desktop app.
    if: ${{ inputs.web_ui }}
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - name: Install Python dependencies
        run: |
          pip install numpy==2.2.6 mkl mkl-include
          pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cu128
          pip install openvino==2026.2.1
          pip install -r requirements.txt
          pip install -r sidecar/requirements.txt
          # YOLOX (Apache-2.0) for training detectors in the app. --no-deps:
          # its declared requirements would let pip replace the torch above.
          pip install yolox==0.3.0 --no-deps
          pip install pyinstaller
      - name: Check the CUDA build covers every supported GPU generation
        # Same guard as the Qt build: the sidecar bundles the same CUDA torch.
        run: |
          python -c "import torch; flags = torch._C._cuda_getArchFlags().split(); print('CUDA archs:', ' '.join(flags)); missing = [a for a in ('sm_61', 'sm_75', 'sm_86', 'sm_120') if a not in flags]; assert not missing, 'torch build lacks ' + ', '.join(missing)"
      - name: Fetch YOLOX detector models (Apache-2.0)
        # models/yolox/ is gitignored (downloaded, not committed). Without this
        # the packaged app has no object detector, and a frozen build never
        # downloads one itself. Bundled via --add-data "models;models".
        run: python tools/get_yolox_model.py
      - name: Pre-convert CLIP to OpenVINO IR
        run: python -m tools.export_clip_ov
      - name: Build the sidecar
        run: >
          pyinstaller packaging/vh-sidecar.spec --noconfirm
          --distpath dist-sidecar --workpath build-sidecar
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Build the app
        # Compiles the exe only — bundle.active is false in tauri.conf.json.
        #
        # Neither Windows installer format can package this app: the sidecar
        # resource is ~1.7 GB (CUDA torch + OpenVINO + the pre-converted CLIP
        # IR), and both installer compilers are 32-bit processes that run out of
        # address space on it. WiX's light.exe ground for 16 minutes and died
        # with no error code; makensis failed with "error mmapping file
        # (1994782295, 33554432) is out of range" — that number is ~1.86 GB.
        #
        # So ship portable, exactly like the Qt build above: a split 7z the user
        # unzips. No code change is needed for this — on Windows Tauri resolves
        # BaseDirectory::Resource to the executable's own directory, so
        # video-highlighter.exe with vh-sidecar/ beside it finds the engine at
        # the same relative path an installer would have created.
        run: pnpm tauri build
        working-directory: frontend
      - name: Assemble the portable app
        # Lay out exe + engine as the app expects to find them at runtime.
        run: |
          $stage = "dist-web/VideoHighlighter"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "frontend/src-tauri/target/release/video-highlighter.exe" $stage
          Copy-Item -Recurse "dist-sidecar/vh-sidecar" "$stage/vh-sidecar"
          # WebView2Loader.dll sits next to the exe when Tauri emits it; ship it
          # if present so the app does not depend on a system-wide copy.
          $loader = "frontend/src-tauri/target/release/WebView2Loader.dll"
          if (Test-Path $loader) { Copy-Item $loader $stage }
          if (-not (Test-Path "$stage/vh-sidecar/vh-sidecar.exe")) {
            throw "vh-sidecar.exe missing from the staged app - the layout is wrong."
          }
          $size = (Get-ChildItem -Recurse $stage | Measure-Object -Property Length -Sum).Sum / 1GB
          Write-Host "Portable app size: $([math]::Round($size, 2)) GB"
      - name: Create archive
        run: 7z a -t7z -mx=9 -v1900m "VideoHighlighter-Web-Windows-${{ needs.version.outputs.slug }}.7z" ./dist-web/VideoHighlighter
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-windows-build
          # Fail loudly rather than uploading nothing if the path drifts again.
          if-no-files-found: error
          path: "VideoHighlighter-Web-Windows-${{ needs.version.outputs.slug }}.7z*"
          retention-days: 7

  build-mac:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system deps
        run: brew install ffmpeg create-dmg hwloc
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # YOLOX (Apache-2.0) for training detectors in the app. --no-deps:
          # its declared requirements would let pip replace the torch above.
          # --no-build-isolation: yolox ships an sdist only, and off Windows its
          # setup.py asserts torch is importable, then pre-compiles
          # FastCOCOEvalOp. An isolated build env never has torch no matter what
          # is installed here, so this is the one job where the build has to see
          # this environment. Windows skips that branch entirely
          # (`if sys.platform != "win32"`), which is why only mac needs it.
          # setuptools/wheel go in first because pip cannot provision build
          # dependencies once isolation is off.
          pip install setuptools wheel
          pip install yolox==0.3.0 --no-deps --no-build-isolation
          pip install pyinstaller
      - name: Fetch YOLOX detector models (Apache-2.0)
        # models/yolox/ is gitignored (downloaded, not committed). Without this
        # the packaged app has no object detector, and a frozen build never
        # downloads one itself. Bundled via --add-data "models;models".
        run: python tools/get_yolox_model.py
      - name: Pre-convert CLIP to OpenVINO IR
        run: python -m tools.export_clip_ov
      - name: Give OpenVINO a libtbb that codesign accepts
        # libtbb.12.dylib was deleted from the bundle in March because it could
        # not be ad-hoc signed. OpenVINO links against it, so `_pyopenvino` then
        # failed to load with "Library not loaded: @rpath/libtbb.12.dylib",
        # which took the whole pipeline with it — action_recognition imports
        # openvino at module scope. Deleting it is not an option; making it
        # signable is the job.
        #
        # The wheel's copies make codesign fail with "internal error in Code
        # Signing subsystem" while *replacing an existing signature*, and
        # PyInstaller signs every binary it collects, so the build dies rather
        # than the app. Two steps, in order of how little they change:
        #
        #   1. strip the signature and prove the file can be signed at all;
        #   2. if it cannot, substitute Homebrew's build of the same library —
        #      same oneTBB soname, an ordinary Mach-O that signs cleanly.
        #
        # Either way the file is left UNSIGNED, so PyInstaller signs it fresh
        # rather than replacing anything, which is the operation that failed.
        #
        # Every dylib here gets that treatment, not just libtbb. Narrowing it to
        # one file is how the second attempt failed: libtbb.12 passed and
        # libtbbmalloc.2 — which kept the wheel's signature — died in exactly
        # the same place.
        #
        # libtbbbind and libhwloc stay deleted: tbbbind is TBB's optional NUMA
        # layer and links Homebrew's libhwloc by absolute path, which no user
        # has. TBB runs without it.
        run: |
          OV_LIBS=$(python -c "import openvino; import os; print(os.path.join(os.path.dirname(openvino.__file__), 'libs'))")
          rm -f "$OV_LIBS"/libtbbbind*
          rm -f "$OV_LIBS"/libhwloc*
          # The unversioned symlink is not what anything links against, and a
          # symlink is one more thing for the bundler to get wrong.
          rm -f "$OV_LIBS"/libtbb.dylib
          xattr -cr "$OV_LIBS" || true

          for lib in "$OV_LIBS"/*.dylib; do
            base=$(basename "$lib")
            codesign --remove-signature "$lib" || true
            if codesign --force --sign - "$lib"; then
              # It signs. Hand PyInstaller an unsigned file anyway: it signs
              # what it collects, and replacing a signature is what errors.
              codesign --remove-signature "$lib" || true
              continue
            fi
            echo "::warning::$base cannot be ad-hoc signed; trying Homebrew's"
            brew install tbb
            replacement="$(brew --prefix tbb)/lib/$base"
            if [ ! -f "$replacement" ]; then
              echo "::error::no replacement for $base, and OpenVINO needs it"
              exit 1
            fi
            cp -f "$replacement" "$lib"
            xattr -c "$lib" || true
            codesign --remove-signature "$lib" || true
          done

          echo "Remaining libs:"
          ls -la "$OV_LIBS"
      - name: Clear PyInstaller cache
        run: rm -rf ~/Library/Application\ Support/pyinstaller
      - name: Build APP
        run: |
          pyinstaller --name "VideoHighlighter" \
            --windowed \
            --noconfirm \
            --add-data "config.yaml:." \
            --add-data "yolo_objects_labels.json:." \
            --add-data "kinetics_400_labels.json:." \
            --add-data "assets:assets" \
            --add-data "modules:modules" \
            --add-data "models:models" \
            --add-data "video_ai_editor/VRVideoOutput.qml:video_ai_editor" \
            --add-data "video_ai_editor/models:video_ai_editor/models" \
            --hidden-import action_recognition \
            --hidden-import convert_pth_to_openvino \
            --hidden-import crop_actions \
            --hidden-import downloader \
            --hidden-import object_recognition \
            --hidden-import pipeline \
            --hidden-import signal_timeline_viewer \
            --hidden-import sorter \
            --hidden-import video_picker_dialog \
            --hidden-import transcript \
            --hidden-import transcript_srt \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtWidgets \
            --hidden-import PySide6.QtQml \
            --hidden-import PySide6.QtQuick \
            --hidden-import PySide6.QtQuickWidgets \
            --hidden-import PySide6.QtMultimedia \
            --collect-submodules whisper \
            --collect-submodules yolox \
            --collect-submodules model_hub \
            --collect-submodules huggingface_hub \
            --collect-submodules keyring \
            --copy-metadata keyring \
            --collect-all openvino \
            --collect-data whisper \
            --collect-binaries imageio_ffmpeg \
            --hidden-import llm.clip_prefilter \
            --hidden-import modules.system.smoke_test \
            --hidden-import psutil \
            --additional-hooks-dir packaging/pyinstaller-hooks \
            --exclude-module nncf \
            --collect-submodules optimum \
            --collect-submodules transformers \
            --collect-data transformers \
            --copy-metadata transformers \
            --copy-metadata tokenizers \
            --copy-metadata huggingface-hub \
            --copy-metadata safetensors \
            --copy-metadata regex \
            main.py
      # TODO(mac): ad-hoc is not shippable. `--sign -` produces no Developer ID,
      # so Gatekeeper quarantines the download and the first launch fails with
      # "VideoHighlighter is damaged and can't be opened" — the README currently
      # talks the user through clearing the quarantine flag, which is fine for a
      # free build and not fine for a paid one. Supporting macOS means an Apple
      # Developer Program identity in secrets, `--options runtime --timestamp`
      # signing against it, then `xcrun notarytool submit --wait` and
      # `xcrun stapler staple` on the DMG.
      - name: Ad-hoc sign the app
        run: |
          codesign --force --deep --sign - "dist/VideoHighlighter.app"
          codesign --verify --verbose "dist/VideoHighlighter.app"
      - name: Smoke-test the app
        # Nobody on the project has a Mac, and the first mac build a tester ran
        # filled his memory until the machine had to be restarted: every
        # multiprocessing child loaded the whole app. This runs the signed .app
        # without a window — imports, a spawned child, object detection's
        # workers, the thumbnail decoder — under a memory ceiling that kills the
        # process tree rather than the runner. modules/system/smoke_test.py has
        # the checks. A failure stops the release.
        #
        # The clips are generated, never real footage: what is measured is how
        # many processes start and what each loads, and that does not depend on
        # what is in the frame. Two codecs because they take different decode
        # paths — H.264 through videotoolbox, and 1080p ProRes in a .mov, which
        # is what the tester was editing when the memory ran out.
        timeout-minutes: 30
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=1280x720:rate=30 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 30 -c:v libx264 -pix_fmt yuv420p -c:a aac smoke-h264.mp4
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=1920x1080:rate=25 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 30 -c:v prores_ks -profile:v 2 -c:a pcm_s16le smoke-prores.mov
          status=0
          for clip in smoke-h264.mp4 smoke-prores.mov; do
            echo "::group::smoke test on $clip"
            "dist/VideoHighlighter.app/Contents/MacOS/VideoHighlighter" \
              --smoke-test "$PWD/$clip" \
              --smoke-report "$PWD/smoke-report-${clip%.*}.json" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke-test
          path: |
            smoke-report-*.json
            ~/Library/Application Support/VideoHighlighter/*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Create DMG
        run: |
          create-dmg \
            --volname "VideoHighlighter" \
            --window-size 600 400 \
            --icon "VideoHighlighter.app" 150 200 \
            --app-drop-link 450 200 \
            "VideoHighlighter-${{ needs.version.outputs.slug }}.dmg" \
            "dist/VideoHighlighter.app"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: VideoHighlighter-${{ needs.version.outputs.slug }}.dmg
          retention-days: 7

  bootstrap:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows bootstrap zip
        run: |
          python tools/build_bootstrap_zip.py \
            --edition free \
            --tag "${{ needs.version.outputs.slug }}" \
            --out packaging/bootstrap/00-VideoHighlighter-Windows-Setup.zip
      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-zip
          # Leading 00- so GitHub's alphabetical Assets list puts the installer
          # first. Without it, Setup.zip sank below the multi-GB .7z parts and
          # the .dmg, and people clicked the wrong file.
          path: packaging/bootstrap/00-VideoHighlighter-Windows-Setup.zip
          retention-days: 7

  release:
    # `version` must be listed even though no build step needs its output
    # directly: needs.version.outputs.slug resolves to an empty string in a job
    # that does not depend on it, which would publish an untagged release.
    # build-web-windows is opt-in: a skipped web build must not skip the
    # release, a failed one must stop it.
    needs: [version, build-windows, build-web-windows, build-mac, bootstrap]
    if: ${{ !inputs.dry_run && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Write the release notes
        env:
          SLUG: ${{ needs.version.outputs.slug }}
          REPO: ${{ github.repository }}
          WEB: ${{ inputs.web_ui }}
        run: |
          dl="https://github.com/$REPO/releases/download/$SLUG"
          portable=""
          for f in windows-build/*.7z.*; do
            n=$(basename "$f"); portable="$portable [.7z.${n##*.7z.}]($dl/$n)"
          done
          {
            echo "## Download"
            echo ""
            echo "### [Install VideoHighlighter for Windows]($dl/00-VideoHighlighter-Windows-Setup.exe)"
            echo ""
            echo "One file. Run it, click through, done. It installs the app with"
            echo "PyTorch for the processor, and downloads NVIDIA GPU acceleration"
            echo "(ticked when an NVIDIA card is found) and the visual search model"
            echo "during setup. Installs per user, no admin rights needed, and a"
            echo "per-user install updates itself in place from then on."
            echo ""
            echo "|  | Installer | Portable |"
            echo "|---|---|---|"
            echo "| Windows (desktop app) | [Setup .exe]($dl/00-VideoHighlighter-Windows-Setup.exe) |$portable |"
            if [ "$WEB" = "true" ]; then
              web=""
              for f in web-windows-build/*.7z.*; do
                n=$(basename "$f"); web="$web [.7z.${n##*.7z.}]($dl/$n)"
              done
              echo "| Windows (web UI) | — |$web |"
            fi
            echo "| macOS | — | [.dmg]($dl/VideoHighlighter-$SLUG.dmg) |"
            echo ""
            echo "The installer is not signed yet, so Windows SmartScreen shows"
            echo "\"Windows protected your PC\" on first run — **More info → Run anyway**."
            echo ""
            echo "The portable download runs on the processor out of the box; the"
            echo "app offers NVIDIA acceleration and visual search as downloads the"
            echo "first time you pick them. If it comes in several \`.7z.0NN\` parts,"
            echo "put them all in one folder and extract the \`.001\` with 7-Zip."
            if [ "$WEB" = "true" ]; then
              echo ""
              echo "The web UI is the Tauri shell around the React frontend with the"
              echo "Python engine bundled; it has no installer because no installer can"
              echo "hold a 1.7 GB sidecar."
            fi
            echo ""
            echo "\`00-VideoHighlighter-Windows-Setup.zip\` is the older script-based"
            echo "installer, kept as a fallback."
          } > release-notes.md
          cat release-notes.md
      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.slug }}
          name: VideoHighlighter ${{ needs.version.outputs.slug }}
          draft: true
          bodyFile: release-notes.md
          artifacts: "windows-installer/*,windows-build/*,web-windows-build/*,mac-build/*,bootstrap-zip/*"
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Say what still has to happen
        # A green run reads as "shipped", and it is not: the release is a draft,
        # which GitHub hides from `releases/latest` and gives no git tag until
        # somebody presses Publish. A build sat unpublished once while the
        # bootstrap installer went on handing out the previous version, and
        # nothing in the run said so. Now it does.
        env:
          SLUG: ${{ needs.version.outputs.slug }}
          UPDATE_BASE_URL: ${{ vars.UPDATE_BASE_URL }}
        run: |
          {
            echo "### $SLUG is a DRAFT — nobody can get it yet"
            echo ""
            echo "Until you press **Publish** on the release page:"
            echo ""
            echo "* \`releases/latest\` keeps returning the previous version, so the"
            echo "  bootstrap installer downloads the old build;"
            echo "* no git tag \`$SLUG\` exists, so the re-release guard cannot"
            echo "  protect this version number yet."
            echo ""
            echo "### Then, to offer it as an in-place update"
            echo ""
            if [ -z "$UPDATE_BASE_URL" ]; then
              echo "The update host is not configured (\`UPDATE_BASE_URL\`), so this"
              echo "release was not staged. See docs/UPDATES.md."
            else
              echo "The files are staged on the update host, unsigned. On the machine"
              echo "with the release key:"
              echo ""
              echo "\`\`\`"
              echo "python tools/publish_release.py sign --version $SLUG --base-url $UPDATE_BASE_URL"
              echo "\`\`\`"
              echo ""
              echo "and run the command it prints (the **Publish update** workflow)."
              echo "Installed copies see the release only after that."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
