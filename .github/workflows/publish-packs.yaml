name: Publish packs

# Puts the packs — PyTorch for NVIDIA (torch-cu128), PyTorch for everyone
# else (torch-cpu), the CLIP model (models-clip) and the frame encoder
# (models-frame-encoder) — on a release of this public repo, where the
# installers and the app download them from. They hold nothing
# edition-specific, and each is under GitHub's 2 GB asset cap.
#
# Run only when a pack changes (a new torch, a re-exported model), a few times
# a year. App releases do not rebuild or re-upload them: build-packs.yaml
# fetches the published ones, and installers pin each by SHA-256.
#
# So a published pack is immutable. This refuses to replace an asset that
# already exists — a new pack gets a new tag — because every installer built
# against the old one checks for the old bytes. The tag is packs-torch-<torch>,
# plus -r<revision> when the same torch is published again with other packs
# (a new model): bump `revision` for that.
#
# The packs come from a finished build-packs run (its packs-and-core
# artifact), the run whose smoke test they already passed, rather than from a
# rebuild whose bytes would differ.

on:
  workflow_dispatch:
    inputs:
      from_run:
        description: 'build-packs run id to take the packs from'
        required: true
      revision:
        description: 'Pack-set revision for the same torch (tag packs-torch-<torch>-r<n>); empty for none'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the packs from the build run
        uses: actions/download-artifact@v4
        with:
          name: packs-and-core
          run-id: ${{ inputs.from_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: in
      - name: Verify, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ inputs.revision }}
        run: |
          python3 - <<'EOF'
          import hashlib, json, os, sys
          packs = json.load(open("in/packs.json", encoding="utf-8-sig"))["packs"]
          names = ("torch-cu128", "torch-cpu", "models-clip", "models-frame-encoder")
          keep = [p for p in packs if p["name"] in names]
          if sorted(p["name"] for p in keep) != sorted(names):
              sys.exit(f"expected {', '.join(names)}, found {[p['name'] for p in keep]}")
          for p in keep:
              path = os.path.join("in", p["asset"])
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for block in iter(lambda: fh.read(1 << 20), b""):
                      h.update(block)
              if h.hexdigest() != p["sha256"].lower():
                  sys.exit(f"{p['asset']}: sha256 does not match packs.json")
              if os.path.getsize(path) != p["bytes"] or p["bytes"] < 1 << 20:
                  sys.exit(f"{p['asset']}: size is wrong or implausibly small")
              if p["bytes"] > 2_000_000_000:
                  sys.exit(f"{p['asset']}: over GitHub's 2 GB asset cap")
              print(f"ok  {p['bytes'] / 2**20:8.0f} MB  {p['asset']}  {p['version']}")
          torch = next(p for p in keep if p["name"] == "torch-cu128")["version"].split("+")[0]
          revision = os.environ.get("REVISION", "").strip()
          if revision and not revision.isdigit():
              sys.exit(f"revision must be a number, got {revision!r}")
          tag = f"packs-torch-{torch}" + (f"-r{revision}" if revision else "")
          os.makedirs("out", exist_ok=True)
          json.dump({"tag": tag, "packs": keep},
                    open("out/packs.json", "w", encoding="utf-8"), indent=2)
          EOF
          # Read here, not through GITHUB_ENV: that only reaches later steps,
          # and an empty tag makes `gh release view` answer about the latest
          # release instead - the app release this must never touch.
          TAG=$(python3 -c "import json; print(json.load(open('out/packs.json'))['tag'])")
          case "$TAG" in
            packs-torch-?*) ;;
            *) echo "::error::unexpected tag '$TAG'"; exit 1 ;;
          esac
          assets=$(python3 -c "import json; print(' '.join('in/' + p['asset'] for p in json.load(open('out/packs.json'))['packs']))")
          if gh release view "$TAG" >/dev/null 2>&1; then
            existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
            for a in $assets out/packs.json; do
              if echo "$existing" | grep -qx "$(basename "$a")"; then
                echo "::error::$TAG already has $(basename "$a"); published packs are never replaced - use a new tag"
                exit 1
              fi
            done
          else
            # A prerelease, and never "latest": the downloader Setup of the
            # regular release asks GitHub for the latest release, and a packs
            # release must never be what it gets.
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Packs: PyTorch $TAG, CLIP, frame encoder" \
              --notes "Components the VideoHighlighter installers and app download: PyTorch for NVIDIA GPUs (torch-cu128), PyTorch for CPU (torch-cpu), the CLIP visual search model (models-clip) and the SigLIP2 frame encoder for taught action models (models-frame-encoder, Apache-2.0). Not an app release - install VideoHighlighter from the latest release. Checksums are in packs.json."
          fi
          gh release upload "$TAG" $assets out/packs.json
          echo "published: https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
