video:
  paths: []
download:
  last_url: ''
  save_dir: D:\movies
  auto_add: true
  auto_combine: true
  download_mode: full
  process_mode: immediate
  concurrent_downloads: 1
  time_range_start: 0
  time_range_end: 300
highlights:
  clip_time: 10
  # 0.0 = best moments wherever they fall, 1.0 = spread evenly over the video
  coverage: 0.0
  output: highlight.mp4
  max_duration: 420
  exact_duration: 0
  keep_temp: false
  export_separate_clips: false
  render_mode: cpu
  auto_min_clip: 2
  auto_max_clip: 30
  auto_merge_gap: 2
  use_time_range: false
  range_start_pct: 0
  range_end_pct: 100
scoring:
  scene_points: 1
  motion_event_points: 0
  motion_peak_points: 0
  audio_peak_points: 0
  loudness_burst_points: 0
  keyword_points: 0
  transcript_points: 0
  object_points: 5
  action_points: 0
  # Expressions score only for the classes named here, e.g. [happy, surprise].
  # Scoring all five would score every second a face is visible.
  face_expression_points: 0
  face_expression_labels: []
  beginning_points: 0
  ending_points: 0
  beginning_seconds: 60
  ending_seconds: 120
  multi_signal_boost: 1.2
  min_signals_for_boost: 2
actions:
  interesting: []
  require_objects: false
objects:
  interesting: []
  confidence: 30
keywords:
  transcript_file: transcript.txt
  interesting: []
transcript:
  enabled: false
  model: base
  source_lang: en
  search_keywords: []
subtitles:
  enabled: false
  source_lang: en
  target_lang: pl
advanced:
  frame_skip: 5
  vr_mode: false
  object_frame_skip: 10
  sample_rate: 5
  yolo_type: standard
  yolo_model_size: n
  yolo_custom_model_path: ''
  action_backend: auto
  r3d_model: r3d_18
  action_models: intel_only
visualization:
  draw_object_boxes: false
  draw_action_labels: false
avoid:
  face_recognition_enabled: false
ui:
  suppress_no_cache_warning: true
loudness_bursts:
  # Where the audio rises above its own local level. Every number here is a
  # policy choice about what to surface, not a property of the audio -- see
  # modules/loudness_bursts.py for what each was measured to do.
  z_threshold: 2.0
  # Seconds an excursion must hold. The single most consequential value: 1.5
  # (which suits sustained applause) reports nothing on material whose events
  # last a second or two.
  min_duration: 1.0
  # Seconds ignored at each end, where titles and music beds live.
  edge_guard: 120
  # Candidates closer than this become one event.
  merge_gap: 30
