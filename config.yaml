video:
  paths: []
download:
  last_url: ''
  save_dir: D:\movies
  auto_add: true
  auto_combine: true
  download_mode: full
  process_mode: immediate
  concurrent_downloads: 1
  time_range_start: 0
  time_range_end: 300
highlights:
  clip_time: 10
  # 0.0 = best moments wherever they fall, 1.0 = spread evenly over the video
  coverage: 0.0
  output: highlight.mp4
  max_duration: 420
  exact_duration: 0
  keep_temp: false
  export_separate_clips: false
  render_mode: cpu
  auto_min_clip: 2
  auto_max_clip: 30
  auto_merge_gap: 2
  use_time_range: false
  range_start_pct: 0
  range_end_pct: 100
scoring:
  # Each signal contributes points toward scoring a moment. Higher values =
  # more likely to be kept (up to max_duration). The sum determines priority.
  scene_points: 1           # Scene cuts get +1 point each (default, enabled)
  motion_event_points: 0    # Motion events from user-taught action classes
  motion_peak_points: 0     # Motion peaks when no action class matched
  audio_peak_points: 0      # Audio peaks (crowd noise, reactions, etc.)
  loudness_burst_points: 0  # Loud bursts detected automatically
  keyword_points: 0         # Transcript keywords you named as "interesting"
  transcript_points: 0      # Transcript presence for claims only
  object_points: 5
  action_points: 0
  # Expressions score only for the classes named here, e.g. [happy, surprise].
  # Scoring all five would score every second a face is visible.
  face_expression_points: 0
  face_expression_labels: []
  beginning_points: 0
  ending_points: 0
  beginning_seconds: 60
  ending_seconds: 120
  multi_signal_boost: 1.2
  min_signals_for_boost: 2
actions:
  # Action classes you want detected. The app learns what these mean from
  # your examples (see docs/DETECTION-GUIDE.md#2-actions for teaching).
  interesting: []      # Empty = user-taught via Training panel only
  require_objects: false  # Whether to also check for objects inside actions
objects:
  # Object classes for detection. The app learns what these are from examples.
  interesting: []      # Empty = all objects detected, you tune which matter
  confidence: 30       # Minimum confidence threshold (0-100)
keywords:
  # Transcript keywords to highlight as "interesting". Named in config.yaml
  # and learned via training examples, or listed here for direct matching.
  transcript_file: transcript.txt
  interesting: []
transcript:
  enabled: false         # Enable Whisper transcripting for transcript analysis
  model: base            # whisper-small, base, medium, large
  source_lang: en        # Language of the source audio
  search_keywords: []    # Keywords to find (e.g. ["goal", "pass"])
subtitles:
  enabled: false         # Enable subtitle generation from transcript
  source_lang: en        # Source language (must match transcript.source_lang)
  target_lang: pl        # Target language for subtitles
advanced:
  # Performance and model options
  frame_skip: 5            # Process every N frames (higher = faster but less precise)
  vr_mode: false           # Enable for VR/360 footage detection
  object_frame_skip: 10    # Object detection sampling interval
  sample_rate: 5           # Audio analysis sample rate (Hz / 1000, e.g. 5 = 5kHz)
  yolo_type: standard      # YOLOX model type (standard or pose)
  yolo_model_size: n       # Model size: n, s, m, l, x (n = smallest/fastest)
  yolo_custom_model_path: ''   # Custom model path for advanced users
  action_backend: auto
  r3d_model: r3d_18
  action_models: intel_only
visualization:
  draw_object_boxes: false
  draw_action_labels: false
avoid:
  face_recognition_enabled: false
ui:
  suppress_no_cache_warning: true
loudness_bursts:
  # Where the audio rises above its own local level. Every number here is a
  # policy choice about what to surface, not a property of the audio -- see
  # modules/loudness_bursts.py for what each was measured to do.
  z_threshold: 2.0
  # Seconds an excursion must hold. The single most consequential value: 1.5
  # (which suits sustained applause) reports nothing on material whose events
  # last a second or two.
  min_duration: 1.0
  # Seconds ignored at each end, where titles and music beds live.
  edge_guard: 120
  # Candidates closer than this become one event.
  merge_gap: 30
