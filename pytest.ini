[pytest]
# Only ever collect our own suite. Without an explicit testpaths, a bare
# `pytest` walks the whole tree and picks up the vendored test modules inside
# build output (dist-sidecar/, build-sidecar/, and the PyInstaller bundle under
# frontend/src-tauri/target/), which import torch at collection time and blow up
# with dozens of collection errors on any machine that has already built once.
testpaths = tests

# Belt and braces: even when someone runs `pytest <path>` explicitly, keep the
# collector out of build and dependency directories.
norecursedirs =
    .git
    .venv
    venv
    node_modules
    build
    dist
    dist-sidecar
    build-sidecar
    frontend/src-tauri/target
    models

addopts = --strict-markers
